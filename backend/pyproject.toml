[project]
name = "video-studio-ai-backend"
version = "0.1.0"
description = "Video Studio AI — backend local (FastAPI + SQLite + FFmpeg)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "pydantic>=2.14,<3",
    # Fase 2 — transcripción local (Apple Silicon), análisis visual y render de subtítulos
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "huggingface-hub>=0.30",
    "anthropic>=0.70",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx2>=2.13",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.uv]
package = false
# mlx-whisper declara torch como dependencia, pero solo lo usa su script de conversión de
# modelos (torch_whisper.py), nunca durante la transcripción: se excluye (~300 MB menos).
override-dependencies = ["torch; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "I001"]
# Líneas largas de argumentos FFmpeg en la generación de medios de prueba.
"tests/test_phase2.py" = ["E501"]
"tests/test_phase3.py" = ["E501"]
"tests/fake_claude.py" = ["E501"]
# Las pruebas usan el fixture fake_cli de la Fase 3 (importado, se redefine como parámetro).
"tests/test_phase4.py" = ["E501", "F811"]
"tests/test_phase41.py" = ["E501"]
"app/services/plan_styles.py" = ["E501"]
"app/services/plan_prompts.py" = ["E501"]
"app/services/animation_direction.py" = ["E501"]
"app/services/scenes.py" = ["E501"]  # instrucciones de sistema de Claude
"app/styles/*.py" = ["E501"]  # descripciones de plantillas para Claude
"tests/test_phase5.py" = ["E501", "F811"]
"tests/test_phase5_matrix.py" = ["E501", "F811"]
"app/services/compositor.py" = ["E501"]
"app/services/layout_engine.py" = ["E501"]
